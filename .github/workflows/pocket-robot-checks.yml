name: Pocket Robot checks
on:
  push:
    branches: [feature/phone-bridge-weather-vk]
  pull_request:
    branches: [main]
jobs:
  server-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Run server tests
        run: python -m unittest discover -s server -p "test_*.py"
      - name: Check Python syntax
        run: python -m compileall -q firmware server
